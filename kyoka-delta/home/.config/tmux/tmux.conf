# Kyoka tmux: status at the bottom. Both blocks lean the same way ("/"),
# so the session and clock read as panes like the Waybar panels.
# The slants use Nerd Font half-block slopes (JetBrainsMono Nerd Font).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#100E19,fg=#A29DBA"

# Session: Violet block, slanted right edge (◤ cut, U+E0BC).
set -g status-left-length 40
set -g status-left "#[bg=#4A30A6,fg=#ECEAF5,bold] ◢ #{=/24/…:session_name} #[nobold]#[bg=#100E19,fg=#4A30A6] "

# Clock: Ice block, slanted left edge (◢ cut, U+E0BA).
set -g status-right-length 40
set -g status-right "#[bg=#100E19,fg=#8FE3F2]#[bg=#8FE3F2,fg=#08070D] %H:%M "

# Windows: glyph index:name.
#   active    shard, Ice on Raised
#   inactive  outlined pane, Ash
#   activity  filled pane, Indigo
set -g window-status-separator ""
set -g window-status-format "#[fg=#A29DBA] #{?window_activity_flag,#[fg=#6F8CF5]▰,▱} #I:#W "
set -g window-status-current-format "#[bg=#1B1729,fg=#8FE3F2] ◢ #I:#W "
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active Violet, inactive Hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#2c2842"
set -g pane-active-border-style "fg=#8b6cf0"
set -g pane-border-indicators off

# Messages, prompts, copy-mode selection, menus.
set -g message-style "bg=#1B1729,fg=#ECEAF5"
set -g message-command-style "bg=#1B1729,fg=#8FE3F2"
set -g mode-style "bg=#1B1729,fg=#ECEAF5"
set -g copy-mode-match-style "bg=#1B1729,fg=#8B6CF0,underscore"
set -g copy-mode-current-match-style "bg=#1B1729,fg=#8FE3F2,underscore"
set -g menu-style "bg=#08070D,fg=#A29DBA"
set -g menu-selected-style "bg=#1B1729,fg=#ECEAF5"
set -g menu-border-style "fg=#8B6CF0"
set -g menu-border-lines single
set -g popup-border-style "fg=#8B6CF0"
set -g popup-border-lines single
set -g display-panes-colour "#2C2842"
set -g display-panes-active-colour "#8FE3F2"
set -g clock-mode-colour "#8FE3F2"
