# Kyoka launcher for fuzzel (unused: SUPER+D runs kyoka-launcher, foot + fzf).
# Centred, 82% void glass, single violet frame (fuzzel draws one border colour).
# Blur comes from the Hyprland layer rule kyoka-launcher-glass (namespace "launcher").

[main]
font=Space Grotesk:size=10.5,Readex Pro:size=10.5
use-bold=no
prompt="╱  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=24
letter-spacing=0.2
layer=overlay
terminal=foot -e

[colors]
# Void 82%
background=08070DD1
text=A29DBAFF
message=A29DBAFF
prompt=8FE3F2FF
placeholder=A29DBA80
input=ECEAF5FF
match=8B6CF0FF
# Raised 60%
selection=1B172999
selection-text=ECEAF5FF
selection-match=8FE3F2FF
counter=9A92C4FF
border=8B6CF0FF

[border]
width=2
radius=0
