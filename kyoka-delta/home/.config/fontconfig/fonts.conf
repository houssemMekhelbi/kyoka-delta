<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Kyoka delta type: Latin-first faces, Arabic and Japanese companions.
       display    Bodoni Moda         + Amiri for Arabic, Shippori Mincho for Japanese
       interface  Space Grotesk       + Readex Pro for Arabic
       mono       JetBrains Mono Nerd Font + Readex Pro
     <accept> puts the companion directly after the Latin face in the
     fallback list, so only glyphs the Latin face lacks (Arabic) use it.
     Geometric symbols (▱ ▰ ◢) that JetBrains Mono lacks come from
     Noto Sans Mono / DejaVu Sans Mono further down the monospace list. -->
<fontconfig>
  <alias binding="same">
    <family>Space Grotesk</family>
    <accept><family>Readex Pro</family></accept>
  </alias>
  <alias binding="same">
    <family>Bodoni Moda</family>
    <accept><family>Amiri</family><family>Shippori Mincho</family></accept>
  </alias>
  <alias binding="same">
    <family>JetBrainsMono Nerd Font</family>
    <accept><family>Readex Pro</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Space Grotesk</family>
      <family>Readex Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Readex Pro</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
