# Kyoka terminal. Void at 84%, compositor blur behind it.

[main]
font=JetBrainsMono Nerd Font:size=11
line-height=15.5
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.84
blur=yes
background=08070D
foreground=A29DBA
cursor=08070D 8FE3F2

regular0=08070D
regular1=B83A5E
regular2=4FB89A
regular3=C9B77A
regular4=6F8CF5
regular5=8B6CF0
regular6=5FBFD6
regular7=A29DBA

bright0=3A3555
bright1=F07F9A
bright2=7FDDBF
bright3=E8DA9E
bright4=9DB0FF
bright5=B49CFF
bright6=8FE3F2
bright7=ECEAF5

# Raised, no inversion
selection-foreground=ECEAF5
selection-background=1B1729

jump-labels=08070D 8FE3F2
scrollback-indicator=08070D 9A92C4
search-box-no-match=ECEAF5 B83A5E
search-box-match=08070D 8FE3F2
urls=8FE3F2

# The same palette again: a colour-theme key bind cannot pull in foot's stock colours.
[colors-light]
alpha=0.84
blur=yes
background=08070D
foreground=A29DBA
cursor=08070D 8FE3F2

regular0=08070D
regular1=B83A5E
regular2=4FB89A
regular3=C9B77A
regular4=6F8CF5
regular5=8B6CF0
regular6=5FBFD6
regular7=A29DBA

bright0=3A3555
bright1=F07F9A
bright2=7FDDBF
bright3=E8DA9E
bright4=9DB0FF
bright5=B49CFF
bright6=8FE3F2
bright7=ECEAF5

# Raised, no inversion
selection-foreground=ECEAF5
selection-background=1B1729

jump-labels=08070D 8FE3F2
scrollback-indicator=08070D 9A92C4
search-box-no-match=ECEAF5 B83A5E
search-box-match=08070D 8FE3F2
urls=8FE3F2
