# Kyoka lock screen: blurred void ground, a tilted mirror emblem cracked
# through, violet aura, Bodoni Moda clock, ice → violet framed glass input.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/kyoka-delta/wallpaper.png
    color = rgb(08070D)
    blur_passes = 3
    blur_size = 7
    brightness = 0.62
    vibrancy = 0.28
    noise = 0.012
}

# ---- emblem: aura, two mirror panes off-axis, one crack -----------------

shape {
    monitor =
    size = 300, 300
    rounding = -1
    color = rgba(8B6CF01C)
    border_size = 0
    position = 18, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 118, 184
    rounding = 0
    rotate = -9
    color = rgba(100E1966)
    border_size = 1
    border_color = rgba(9A92C4AA)
    position = -10, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 118, 184
    rounding = 0
    rotate = 5
    color = rgba(00000000)
    border_size = 2
    border_color = rgba(8FE3F2FF)
    position = 12, 244
    halign = center
    valign = center
}

shape {
    monitor =
    size = 2, 230
    rounding = 0
    rotate = 31
    color = rgba(8B6CF0FF)
    border_size = 0
    position = 4, 250
    halign = center
    valign = center
}

# ---- time and date -----------------------------------------------------

label {
    monitor =
    text = <span font_weight="500">$TIME</span>
    color = rgba(ECEAF5FF)
    font_size = 104
    font_family = Bodoni Moda
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000'>$(date +'%A  ·  %d %B %Y' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(9A92C4FF)
    font_size = 13
    font_family = Space Grotesk
    position = 0, -40
    halign = center
    valign = center
}

# ---- input: glass shard with the active-window gradient ---------------

input-field {
    monitor =
    size = 420, 52
    outline_thickness = 2
    outer_color = rgba(8FE3F2FF) rgba(8B6CF0FF) rgba(4A30A6FF) 300deg
    inner_color = rgba(100E19B8)
    font_color = rgba(ECEAF5FF)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(8FE3F2FF) rgba(8B6CF0FF) 300deg
    fail_color = rgba(B83A5EFF)
    capslock_color = rgba(6F8CF5FF)
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##A29DBA">◢   password</span>
    fail_text = <span foreground="##F07F9A">$FAIL</span>
    check_text = <span foreground="##8FE3F2">verifying</span>
    position = 0, -120
    halign = center
    valign = center
}

# Saying in romaji (Bodoni Moda Italic) beside its Japanese (Shippori Mincho).
# Edit the sayings in ~/.config/hypr/kyoka-delta/sayings.txt.
label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kyoka-lock-saying
    color = rgba(8FE3F2FF)
    font_size = 20
    font_family = Shippori Mincho
    position = 0, -195
    halign = center
    valign = center
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = KYOKA  ╱  HATTIN
    color = rgba(9A92C499)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 36
    halign = center
    valign = bottom
}
